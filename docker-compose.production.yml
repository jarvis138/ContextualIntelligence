version: '3.8'

services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpi-hub-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
    volumes:
      - app-logs:/app/logs
      - app-backups:/app/backups
    depends_on:
      - db
    networks:
      - cpi-network

  # PostgreSQL database service
  db:
    image: postgres:15-alpine
    container_name: cpi-hub-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
      - POSTGRES_DB=${PGDATABASE:-cpihub}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - cpi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-cpihub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy for SSL termination and static assets
  nginx:
    image: nginx:alpine
    container_name: cpi-hub-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - cpi-network

  # Backup service (scheduled with cron)
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpi-hub-backup
    restart: always
    command: sh -c "node /app/scripts/backup.js --storage=local && echo '0 2 * * * node /app/scripts/backup.js --storage=local' > /etc/crontabs/root && crond -f"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    volumes:
      - app-backups:/app/backups
      - app-logs:/app/logs
    depends_on:
      - db
    networks:
      - cpi-network

networks:
  cpi-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  app-logs:
    driver: local
  app-backups:
    driver: local