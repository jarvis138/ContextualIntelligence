              key: REDIS_URL
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contextual-intelligence-ingress
spec:
  rules:
  - host: eu-west.api.contextualintelligence.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80