apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  template:
    spec:
      containers:
      - name: auth-service
        env:
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: REGION
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: PRIMARY_DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: REDIS_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
spec:
  template:
    spec:
      containers:
      - name: document-service
        env:
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: REGION
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: PRIMARY_DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: REDIS_URL
        - name: ELASTICSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: region-config
              key: ELASTICSEARCH_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  template:
    spec:
      containers:
      - name: ai-service
        env:
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: region-config
