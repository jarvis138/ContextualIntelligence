apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Core infrastructure
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - persistent-volume.yaml
  - redis.yaml
  
  # Infrastructure services
  - infrastructure/api-gateway.yaml
  - infrastructure/rabbitmq.yaml
  - infrastructure/elasticsearch.yaml
  
  # Microservices
  - services/auth-service.yaml
  - services/document-service.yaml
  
  # Legacy monolith (to be phased out)
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: contextual-intelligence
  app.kubernetes.io/instance: production
  app.kubernetes.io/part-of: contextual-intelligence-platform
  app.kubernetes.io/managed-by: kustomize

namespace: contextual-intelligence

images:
  # Legacy monolith image
  - name: ${DOCKER_REGISTRY}/contextual-intelligence
    newName: ${DOCKER_REGISTRY}/contextual-intelligence
    newTag: latest
    
  # Microservice images
  - name: ${DOCKER_REGISTRY}/auth-service
    newName: ${DOCKER_REGISTRY}/auth-service
    newTag: latest
    
  - name: ${DOCKER_REGISTRY}/document-service
    newName: ${DOCKER_REGISTRY}/document-service
