service: contextual-intelligence-document-processing

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 1024
  timeout: 30
  logRetentionInDays: 14
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    ELASTICSEARCH_URL: ${self:custom.elasticsearch.${self:provider.stage}}
    DOCUMENT_BUCKET: ${self:custom.documentBucket.${self:provider.stage}}
    REDIS_URL: ${self:custom.redis.${self:provider.stage}}
    OPENAI_API_KEY: ${ssm:/contextual-intelligence/${self:provider.stage}/openai-api-key~true}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - arn:aws:s3:::${self:custom.documentBucket.${self:provider.stage}}/*
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: 
            - !GetAtt DocumentProcessingQueue.Arn
            - !GetAtt DocumentIndexingQueue.Arn

custom:
  elasticsearch:
    dev: http://elasticsearch-dev.contextualintelligence.internal:9200
    staging: http://elasticsearch-staging.contextualintelligence.internal:9200
    prod: http://elasticsearch-prod.contextualintelligence.internal:9200
  redis:
    dev: redis://redis-dev.contextualintelligence.internal:6379
    staging: redis://redis-staging.contextualintelligence.internal:6379
    prod: redis://redis-prod.contextualintelligence.internal:6379
  documentBucket:
    dev: contextual-intelligence-documents-dev
    staging: contextual-intelligence-documents-staging
    prod: contextual-intelligence-documents-prod
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node18
    define:
      'process.env.NODE_ENV': '"production"'
    exclude:
      - aws-sdk
      - pg-native

functions:
  documentProcessor:
    handler: src/handlers/document-processor.handler
    events:
      - sqs:
          arn: !GetAtt DocumentProcessingQueue.Arn
          batchSize: 5
          maximumBatchingWindow: 60
    environment:
      OUTPUT_QUEUE_URL: !Ref DocumentIndexingQueue
  
  documentIndexer:
    handler: src/handlers/document-indexer.handler
    events:
      - sqs:
          arn: !GetAtt DocumentIndexingQueue.Arn
          batchSize: 10
          maximumBatchingWindow: 60
  
  documentEmbedding:
    handler: src/handlers/document-embedding.handler
    timeout: 60
    memorySize: 2048
    events:
      - http:
          path: /embedding
          method: post
          cors: true
          authorizer:
            type: jwt
            identitySource: $request.header.Authorization
            issuerUrl: https://auth.contextualintelligence.com/
  
  documentOcr:
    handler: src/handlers/document-ocr.handler
    timeout: 120
    memorySize: 2048
    events:
      - http:
          path: /ocr
          method: post
          cors: true
          authorizer:
            type: jwt
            identitySource: $request.header.Authorization
            issuerUrl: https://auth.contextualintelligence.com/
  
  documentSummary:
    handler: src/handlers/document-summary.handler
    timeout: 60
    memorySize: 1024
    events:
      - http:
          path: /summary
          method: post
          cors: true
          authorizer:
            type: jwt
            identitySource: $request.header.Authorization
            issuerUrl: https://auth.contextualintelligence.com/

resources:
  Resources:
    DocumentProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-processing-${self:provider.stage}
        VisibilityTimeout: 120
        MessageRetentionPeriod: 1209600 # 14 days
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DocumentProcessingDLQ.Arn
          maxReceiveCount: 3
    
    DocumentProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-processing-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600 # 14 days
    
    DocumentIndexingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-indexing-${self:provider.stage}
        VisibilityTimeout: 120
        MessageRetentionPeriod: 1209600 # 14 days
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DocumentIndexingDLQ.Arn
          maxReceiveCount: 3
    
    DocumentIndexingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-indexing-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600 # 14 days

plugins:
  - serverless-esbuild
  - serverless-offline